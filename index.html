    function visaKategori(kat) {
      document.getElementById("bp-meny").style.display = "none";
      document.getElementById("bp-lista").style.display = "flex";
      const ruta = document.getElementById("bp-val");
      ruta.innerHTML = "";
      const lista = kat === "hjul" ? skins : bakgrunder;
      Object.keys(lista).forEach(function (id) {
        const d = document.createElement("div");
        d.className = "skin" + (val[kat] === id ? " vald" : "");
        if (kat === "hjul") {
          const m = document.createElement("div");
          m.className = "minihjul";
          m.innerHTML = '<div class="miniskal"><div id="hjul"><div id="streck"></div><div id="pinnar"></div><div id="glans"></div></div><div id="nav"></div></div>';
          stylaHjulElement(lista[id], m.querySelector("#hjul"), m.querySelector("#streck"), m.querySelector("#pinnar"), m.querySelector("#nav"));
          const pil = document.createElement("div"); pil.className = "minipil"; stylaPil(pil, lista[id].pil); m.appendChild(pil);
          d.appendChild(m);
        } else {
          const r = document.createElement("div");
          r.className = "minirum";
          const b = lista[id];
          r.innerHTML = '<div class="miniscen"><div class="mv" style="background:' + b.vagg + ';background-size:' + (b.vaggstorlek || "100% 100%") + '"></div>' +
            '<div class="mg" style="background-color:' + b.golv + ';background-image:' + b.golvbild + ';background-size:' + (b.golvstorlek || "100% 100%, 90px 90px, 90px 90px, 8px 8px") + '"></div><div class="minisaker"></div></div>';
          byggSaker(r.querySelector(".minisaker"), b, true);
          d.appendChild(r);
        }
        const t = document.createElement("div");
        t.textContent = lista[id].namn;
        d.appendChild(t);
        d.onclick = function () { val[kat] = id; anvandVal(); visaKategori(kat); };
        ruta.appendChild(d);
      });
    }
    function visaMeny() {
      document.getElementById("bp-lista").style.display = "none";
      document.getElementById("bp-meny").style.display = "flex";
    }

      document.getElementById("start").style.display = "flex";
      document.getElementById("backpack").style.display = "none";
    }
    function oppnaBackpack() { document.getElementById("backpack").style.display = "flex"; }
    function stangBackpack() { document.getElementById("backpack").style.display = "none"; visaMeny(); }

    function snurra() {
      tickaUnderSnurr();
      const vinnare = Math.floor(Math.random() * spel.length);
      const sektor = 360 / spel.length;
      varv += 5 * 360 + (360 - vinnare * sektor - sektor / 2);
      HJUL.style.transform = "rotate(" + varv + "deg)";
      document.getElementById("resultat").textContent = "";
      document.getElementById("fraga").textContent = "";
      document.getElementById("svar").innerHTML = "";
      document.getElementById("facit").textContent = "";
      setTimeout(function () {
        document.getElementById("resultat").textContent = "You got: " + spel[vinnare];
        visaFraga(spel[vinnare]);
      }, 4000);
    }
