  <button onclick="snurra()">SNURRA</button>
  <p id="resultat"></p>
  <div id="fraga"></div>
  <div id="svar"></div>
  <p id="facit"></p>

  <script>
    const spel = ["Rivals", "Doors", "Brookhaven", "Steal a Brainrot", "Grow a Garden", "Murder Mystery"];
    let varv = 0;
    let poang = 0;

    const fragor = {
      "Rivals":           { f: "Vad är Rivals för sorts spel?", svar: ["Skjutspel", "Trädgårdsspel", "Skräckspel"], ratt: 0 },
      "Doors":            { f: "Vad heter monstret som rusar genom rummen i Doors?", svar: ["Rush", "Bob", "Speedy"], ratt: 0 },
      "Brookhaven":       { f: "Vad gör man i Brookhaven?", svar: ["Skjuter zombies", "Lever ett låtsasliv i en stad", "Bygger raketer"], ratt: 1 },
      "Steal a Brainrot": { f: "Vad gör man i Steal a Brainrot?", svar: ["Snor brainrots från andras baser", "Odlar morötter", "Kör bilar"], ratt: 0 },
      "Grow a Garden":    { f: "Vad heter pengarna i Grow a Garden?", svar: ["Robux", "Sheckles", "Guld"], ratt: 1 },
      "Murder Mystery":   { f: "Vem har pistolen i Murder Mystery 2?", svar: ["Mördaren", "Sheriffen", "Alla"], ratt: 1 }
    };

    function visaFraga(spelnamn) {
      const q = fragor[spelnamn];
      document.getElementById("fraga").textContent = q.f;
      document.getElementById("facit").textContent = "";
      const ruta = document.getElementById("svar");
      ruta.innerHTML = "";
      q.svar.forEach(function (text, i) {
        const knapp = document.createElement("button");
        knapp.textContent = text;
        knapp.onclick = function () {
          ruta.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
          if (i === q.ratt) {
            document.getElementById("facit").textContent = "Rätt! 🎉";
            poang = poang + 1;
            document.getElementById("poang").textContent = "Poäng: " + poang;
          } else {
            document.getElementById("facit").textContent = "Fel. Rätt svar: " + q.svar[q.ratt];
          }
        };
        ruta.appendChild(knapp);
      });
    }

    function snurra() {
      const vinnare = Math.floor(Math.random() * spel.length);
      varv += 5 * 360 + (360 - vinnare * 60 - 30);
      document.getElementById("hjul").style.transform = "rotate(" + varv + "deg)";
      document.getElementById("resultat").textContent = "";
      document.getElementById("fraga").textContent = "";
      document.getElementById("svar").innerHTML = "";
      document.getElementById("facit").textContent = "";
      setTimeout(function () {
        document.getElementById("resultat").textContent = "Du fick: " + spel[vinnare];
        visaFraga(spel[vinnare]);
      }, 4000);
    }
  </script>
